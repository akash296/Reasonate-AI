<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | Reasonate AI</title>

<link rel="stylesheet" href="style.css">

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#070b18;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.signup-box{
width:400px;
padding:40px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.1);
backdrop-filter:blur(15px);
border-radius:20px;
text-align:center;
}

.signup-box img{
height:80px;
margin-bottom:20px;
}

.signup-box h2{
color:#fff;
margin-bottom:25px;
}

.input-box{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:10px;
background:#11182d;
color:#fff;
font-size:16px;
box-sizing:border-box;
}

.signup-btn{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:linear-gradient(90deg,#4f46e5,#06b6d4);
color:#fff;
font-size:18px;
cursor:pointer;
}

.signup-btn:hover{
opacity:.9;
}

p{
color:#bbb;
}

a{
color:#06b6d4;
text-decoration:none;
}
</style>
</head>

<body>

<div class="signup-box">

<img src="logo.png.png" alt="Reasonate AI">

<h2>Create Account</h2>

<input class="input-box" type="text" placeholder="Full Name">

<input class="input-box" type="email" placeholder="Email">

<input class="input-box" type="password" placeholder="Password">

<input class="input-box" type="password" placeholder="Confirm Password">

<button class="signup-btn">Create Account</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

<div class="back-home">
    <a href="index.html">← Back to Home</a>
</div>

</div>

</body>
